<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Speech Builder{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🎤 Speech Builder</div>
    <div class="nav-links">
      {% if user %}
        <img src="{{ user.picture }}" class="avatar" alt="{{ user.name }}"/>
        <span class="nav-name">{{ user.name }}</span>
        <a href="/logout" class="btn btn-ghost">Sign out</a>
      {% else %}
        <a href="/login" class="btn btn-primary">Sign in with Google</a>
      {% endif %}
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer><p>Built for Shah · Powered by Gemini AI</p></footer>
</body>
</html>
