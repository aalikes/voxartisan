name: Test

# A test nobody runs is a comment. This runs on every push and pull request.
# It needs no secrets and no install step — the suite has no dependencies and
# stubs fetch rather than reaching any provider — so it stays fast and cannot
# be blocked by the credential problems that stall the deploy workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test
