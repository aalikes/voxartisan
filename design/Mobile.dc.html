<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FAF7F2; }
    a { color: #A05A3C; } a:hover { color: #7E4429; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="font-family: 'Space Grotesk', system-ui, sans-serif; background: #FAF7F2; color: #14100C; min-height: 100%; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid rgba(20,16,12,0.10); flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><path d="M13 2 L21.5 7 L21.5 17 L13 22 L4.5 17 L4.5 7 Z" stroke="#3A5580" stroke-width="1.5" fill="none"/><path d="M13 7.5 L17 10 L17 15 L13 17.5 L9 15 L9 10 Z" fill="#A05A3C"/></svg>
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 16px; font-weight: 500">Vox<span style="color: #A05A3C">Artisan</span></span>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -12px">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="#14100C" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div style="padding: 22px 20px 0; flex-shrink: 0">
    <div style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A05A3C; font-weight: 700; margin-bottom: 9px">Engaging Humor · L2 · 7 min</div>
    <h1 style="font-family: 'Newsreader', Georgia, serif; font-size: 29px; line-height: 1.12; font-weight: 400; letter-spacing: -0.015em; margin: 0 0 18px; text-wrap: pretty">Tounen Ba Ou, Mesye Toastmaster</h1>

    <div style="display: flex; gap: 7px; overflow-x: auto; padding-bottom: 16px">
      <div style="padding: 9px 15px; font-size: 13px; border-radius: 999px; background: #14100C; color: #FAF7F2; font-weight: 500; white-space: nowrap; min-height: 38px; display: flex; align-items: center">Kreyòl</div>
      <div style="padding: 9px 15px; font-size: 13px; border-radius: 999px; border: 1px solid rgba(20,16,12,0.20); color: #6B6157; white-space: nowrap; min-height: 38px; display: flex; align-items: center">English</div>
      <div style="padding: 9px 15px; font-size: 13px; border-radius: 999px; border: 1px solid rgba(20,16,12,0.20); color: #6B6157; white-space: nowrap; min-height: 38px; display: flex; align-items: center">Français</div>
      <div style="padding: 9px 15px; font-size: 13px; border-radius: 999px; border: 1px solid rgba(20,16,12,0.20); color: #6B6157; white-space: nowrap; min-height: 38px; display: flex; align-items: center">Español</div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 4px 20px 0">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 11px">
      <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #A05A3C; font-weight: 700">Hook</span>
      <span style="flex-grow: 1; height: 1px; background: rgba(20,16,12,0.10)"></span>
    </div>
    <p style="font-family: 'Newsreader', Georgia, serif; font-size: 19px; line-height: 1.62; margin: 0 0 12px; text-wrap: pretty">Kat bal. Yonn apre lòt. Okenn pa t manyen panye a.</p>
    <p style="font-family: 'Newsreader', Georgia, serif; font-size: 19px; line-height: 1.62; margin: 0 0 26px; text-wrap: pretty">
      <span style="display: inline-block; font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: 0.05em; color: #A05A3C; background: rgba(160,90,60,0.09); border-radius: 3px; padding: 2px 7px; margin-right: 7px; vertical-align: 2px">Long pause</span>Li te gen dizwitan.
    </p>

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 11px">
      <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #A05A3C; font-weight: 700">Salitasyon</span>
      <span style="flex-grow: 1; height: 1px; background: rgba(20,16,12,0.10)"></span>
    </div>
    <p style="font-family: 'Newsreader', Georgia, serif; font-size: 19px; line-height: 1.62; margin: 0; text-wrap: pretty">Mesye ak Madam Toastmaster, Toastmasters distenge, konfrè Toastmasters…</p>
  </div>

  <!-- Bottom action bar — thumb reach, 44px+ targets -->
  <div style="display: flex; gap: 8px; padding: 12px 20px 26px; border-top: 1px solid rgba(20,16,12,0.10); background: #FFFDFA; flex-shrink: 0">
    <button style="flex-grow: 1; font-family: inherit; font-size: 14px; min-height: 46px; border-radius: 5px; border: 1px solid #14100C; background: #14100C; color: #FAF7F2; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 3v14M6 6.5v7M14 6.5v7M2.5 9v2M17.5 9v2" stroke="#FAF7F2" stroke-width="1.6" stroke-linecap="round"/></svg>
      Teleprompter
    </button>
    <button style="width: 46px; min-height: 46px; border-radius: 5px; border: 1px solid rgba(20,16,12,0.22); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l3.5 3.5L16 5.5" stroke="#14100C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button style="width: 46px; min-height: 46px; border-radius: 5px; border: 1px solid rgba(20,16,12,0.22); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M3 13.5L13 3.5l3.5 3.5L6.5 17H3v-3.5z" stroke="#14100C" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
